name: Build Windows EXE (Nuitka)

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    name: Build on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nuitka cryptography

      - name: Build with Nuitka
        run: |
          $env:NUITKA_ASSUME_YES_FOR_DOWNLOADS = "1"

          python -m nuitka `
            --mode=onefile `
            --assume-yes-for-downloads `
            --windows-console-mode=disable `
            --enable-plugin=tk-inter `
            --include-package=cryptography `
            --include-package=_cffi_backend `
            --output-filename=AESFolderTool.exe `
            --output-dir=dist `
            main.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AESFolderTool-Windows
          path: dist/AESFolderTool.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AESFolderTool.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
